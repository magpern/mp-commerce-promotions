name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-build:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.1'
          - '8.2'
          - '8.3'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax lint
        run: composer run lint:php

      - name: PHPUnit unit tests
        run: composer run test

      # Advisory only — never fails the job. Hard gates: validate, lint:php, test, build zip.
      - name: PHPCS advisory
        continue-on-error: true
        run: composer run lint:phpcs || true

      - name: Build release zip
        env:
          MP_CP_BUILD_ROOT: ${{ github.workspace }}/build
        run: bash scripts/build-zip.sh

      - name: Verify release zip exists
        run: |
          VERSION="$(grep -E "define\s*\(\s*'MP_COMMERCE_PROMOTIONS_VERSION'" mp-commerce-promotions.php | head -n 1 | sed -E "s/.*'([^']+)'.*/\1/")"
          ZIP_PATH="${GITHUB_WORKSPACE}/build/mp-commerce-promotions-${VERSION}.zip"
          if [[ ! -f "${ZIP_PATH}" ]]; then
            echo "ERROR: Expected zip not found: ${ZIP_PATH}" >&2
            exit 1
          fi
          echo "OK: ${ZIP_PATH}"
