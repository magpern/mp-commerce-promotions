name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax lint
        run: composer run lint:php

      - name: PHPUnit unit tests
        run: composer run test

      - name: PHPCS (informational, non-blocking)
        continue-on-error: true
        run: composer run lint:phpcs

      - name: Build release zip
        run: bash scripts/build-zip.sh

      - name: Verify release zip exists
        run: |
          VERSION="$(grep -E "define\s*\(\s*'MP_COMMERCE_PROMOTIONS_VERSION'" mp-commerce-promotions.php | head -n 1 | sed -E "s/.*'([^']+)'.*/\1/")"
          ZIP_PATH="${GITHUB_WORKSPACE}/../build/mp-commerce-promotions-${VERSION}.zip"
          if [[ ! -f "${ZIP_PATH}" ]]; then
            echo "ERROR: Expected zip not found: ${ZIP_PATH}" >&2
            exit 1
          fi
          echo "ZIP_PATH=${ZIP_PATH}" >> "${GITHUB_ENV}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "OK: ${ZIP_PATH}"

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mp-commerce-promotions-${{ env.VERSION }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      - name: Determine prerelease flag
        id: release_meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PRERELEASE=false
          case "${VERSION}" in
            *beta*|*pilot*|*rc*|*alpha*)
              PRERELEASE=true
              ;;
          esac
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Resolve release notes body
        id: release_notes
        run: |
          VERSION="${{ steps.release_meta.outputs.version }}"
          NOTES="docs/GITHUB_RELEASE_NOTES_${VERSION}.md"
          if [[ ! -f "${NOTES}" ]]; then
            ALT="docs/GITHUB_RELEASE_NOTES_${VERSION//./_}.md"
            if [[ -f "${ALT}" ]]; then
              NOTES="${ALT}"
            fi
          fi
          if [[ ! -f "${NOTES}" ]] && [[ "${VERSION}" == "0.3.0-pilot.1" ]]; then
            NOTES="docs/GITHUB_RELEASE_NOTES_0.3.0_PILOT1.md"
          fi
          if [[ ! -f "${NOTES}" ]]; then
            echo "ERROR: No release notes file for version ${VERSION}" >&2
            exit 1
          fi
          echo "path=${NOTES}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Commerce Promotions ${{ steps.release_meta.outputs.version }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          generate_release_notes: false
          body_path: ${{ steps.release_notes.outputs.path }}
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
